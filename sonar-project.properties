sonar.projectKey=pas7-studio_nestjs-strict-json
sonar.organization=pas7-studio

sonar.sources=src
sonar.tests=test
sonar.exclusions=**/*.d.ts,dist/**,**/node_modules/**
sonar.test.exclusions=**/*.e2e.spec.ts,**/*.d.ts
sonar.typescript.tsconfigPath=tsconfig.build.json
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/examples/**,**/scripts/**,**/*.config.ts,**/*.d.ts
sonar.cpd.exclusions=test/**/*.e2e.spec.ts,performance/**,**/examples/**
sonar.sourceEncoding=UTF-8
